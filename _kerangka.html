<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 1. Ganti NAMA HALAMAN -->
  <title>Wireframe: NAMA HALAMAN</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="kotak">Logo • NAMA PRODUK</header>
  <nav class="kotak"><a href="index.html">Beranda</a> <a href="#">Menu 2</a> <a href="#">Menu 3</a></nav>

  <main>
    <!-- 2. Ganti judul, fitur, dan nama pembuat -->
    <h1>Judul Halaman</h1>
    <p class="catatan">Fitur: ... (dari Kartu Fitur) • Dibuat oleh: NAMA</p>

    <!-- 3. Susun isi halaman dengan potongan di bawah. Hapus yang tidak dipakai, salin yang perlu. -->
    <section class="kotak">
      <h2>Contoh formulir</h2>
      <label>Nama</label>
      <div class="isian"></div>
      <label>Keterangan</label>
      <div class="isian besar"></div>
      <div class="tombol">Kirim</div><span class="js">JS</span>
      <p class="catatan">Saat tombol ditekan: ... (tulis apa yang terjadi)</p>
    </section>

    <section class="kotak">
      <h2>Contoh daftar / tabel</h2>
      <table>
        <tr><th>Kolom 1</th><th>Kolom 2</th><th>Kolom 3</th></tr>
        <tr><td></td><td></td><td></td></tr>
        <tr><td></td><td></td><td></td></tr>
      </table>
    </section>

    <section class="kotak">
      <h2>Contoh teks dan gambar</h2>
      <div class="gambar">Gambar</div>
      <div class="teks"></div>
      <div class="teks pendek"></div>
    </section>
  </main>

  <footer class="kotak">Footer • Kelompok ... • XI RPL 1</footer>
</body>
</html>
